{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include "head.html" %}
    {% block meta %}
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
    {% endblock meta %}
    <script src="https://cdn.tailwindcss.com">
    </script>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <div style="flex: 1;">
        {% block content %}{% endblock content %}
    </div>

    <footer>
        {% include 'footer.html' %}
    </footer>

    {% block script %}
    {% endblock script %}
</body>
</html>
