{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-white">
    <!-- Hero Section -->
    <div class="relative h-40 bg-gradient-to-r from-gray-50 to-gray-100 mb-12">
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width=\"20\" height=\"20\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cpath d=\"M0 0h20v20H0z\" fill=\"%23F9FAFB\" fill-opacity=\"0.4\"/%3E%3C/svg%3E')] bg-repeat opacity-30"></div>
        </div>
        <div class="container mx-auto px-4 h-full flex items-center justify-center">
            <h1 class="text-3xl font-light tracking-[0.2em] text-gray-800">OUR COLLECTIONS</h1>
        </div>
    </div>

    <!-- Category Navigation -->
    <div class="container mx-auto px-4 mb-16">
        <div class="flex justify-center space-x-12 text-sm tracking-wider">
            <a href="#" class="category-link relative group">
                <span class="text-gray-800 hover:text-black transition-colors duration-300">ALL</span>
                <span class="absolute -bottom-2 left-0 w-0 h-px bg-black transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="#" class="category-link relative group">
                <span class="text-gray-800 hover:text-black transition-colors duration-300">RINGS</span>
                <span class="absolute -bottom-2 left-0 w-0 h-px bg-black transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="#" class="category-link relative group">
                <span class="text-gray-800 hover:text-black transition-colors duration-300">BRACELETS</span>
                <span class="absolute -bottom-2 left-0 w-0 h-px bg-black transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="#" class="category-link relative group">
                <span class="text-gray-800 hover:text-black transition-colors duration-300">NECKLACES</span>
                <span class="absolute -bottom-2 left-0 w-0 h-px bg-black transition-all duration-300 group-hover:w-full"></span>
            </a>
            <a href="#" class="category-link relative group">
                <span class="text-gray-800 hover:text-black transition-colors duration-300">EARRINGS</span>
                <span class="absolute -bottom-2 left-0 w-0 h-px bg-black transition-all duration-300 group-hover:w-full"></span>
            </a>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="container mx-auto px-4 mb-20">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            {% for i in "123456789"|make_list %}
            <div class="product-card group">
                <a href="#" class="block">
                    <div class="relative aspect-square overflow-hidden bg-gray-50">
                        <img src="/api/placeholder/600/600" 
                             alt="Luxury jewelry piece"
                             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                        <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-5 transition-opacity duration-300"></div>
                        <button class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm text-gray-900 px-6 py-2 text-sm tracking-wider transform translate-y-full opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300">
                            VIEW DETAILS
                        </button>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-sm font-light tracking-wider text-gray-900 mb-1">Crystal Elegance Ring</h3>
                        <p class="text-sm text-gray-600">$299</p>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    @keyframes shimmer {
        0% {
            background-position: -1000px 0;
        }
        100% {
            background-position: 1000px 0;
        }
    }
    
    .product-card {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .product-card:hover {
        transform: translateY(-8px);
    }
    
    .category-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: -4px;
        left: 0;
        background-color: currentColor;
        transition: width 0.3s ease;
    }
    
    .category-link:hover::after {
        width: 100%;
    }
</style>
{% endblock %}
